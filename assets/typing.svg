<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">Presentacion animada de Brandon Bello</title>
  <desc id="desc">Texto animado con el perfil profesional de Brandon Bello.</desc>
  <g fill="#22d3ee" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="22px" font-weight="600" text-anchor="middle">
