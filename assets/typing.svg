    <text x="450" y="43" opacity="0">Backend / Cloud / Data / Automation
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.27;0.33;0.47;0.54;1" />
    </text>
    <text x="450" y="43" opacity="0">Cofundador de Softdatai
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.54;0.60;0.74;0.81;1" />
    </text>
    <text x="450" y="43" opacity="0">Building products that scale
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.81;0.87;0.98;0.99;1" />
    </text>
